name: Trigger merge shared timetable classes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-shared-classes-v2-trigger.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/merge-shared-classes-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Merge identical courses across classes in all view"
          git push
