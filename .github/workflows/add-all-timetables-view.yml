name: Add all timetables view

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-all-timetables-view.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f"Expected block not found: {old[:120]}")
              text = text.replace(old, new, 1)

          replace_once(
              ".day-button.active {\n    background: #222;\n    color: white;\n}\n\n/* 完整课表 */",
              ".day-button.active {\n    background: #222;\n    color: white;\n}\n\n.view-mode-buttons {\n    grid-template-columns: repeat(2, 1fr);\n    margin-bottom: 10px;\n}\n\n/* 完整课表 */"
          )

          replace_once(
              "        <div\n            class=\"day-buttons\"\n            id=\"viewDayButtons\">\n        </div>",
              "        <div\n            class=\"day-buttons view-mode-buttons\"\n            id=\"viewModeButtons\">\n        </div>\n\n        <div\n            class=\"day-buttons\"\n            id=\"viewDayButtons\">\n        </div>"
          )

          replace_once(
              "let selectedViewDay = 0;\n\nlet selectedEditDay = 0;",
              "let selectedViewDay = 0;\n\nlet selectedViewMode = \"class\";\n\nlet allSchedules = {};\n\nlet allSchedulesLoaded = false;\n\nlet selectedEditDay = 0;"
          )

          marker = "/* =====================================================\n   完整课表星期按钮\n   ===================================================== */\n\nfunction renderViewDays() {"
          addition = '''/* =====================================================
   读取所有班级课表
   ===================================================== */

async function loadAllSchedules() {
    const loaded = {};

    for (const classInfo of classList) {
        const personal = loadPersonalSchedule(classInfo.name);

        if (personal) {
            loaded[classInfo.name] = copySchedule(personal);
            continue;
        }

        try {
            const response = await fetch(classInfo.file);
            if (!response.ok) throw new Error("无法读取 " + classInfo.file);
            loaded[classInfo.name] = await response.json();
        }
        catch (error) {
            console.error(error);
            loaded[classInfo.name] = copySchedule(defaultSchedule);
        }
    }

    allSchedules = loaded;
    allSchedulesLoaded = true;
}


/* =====================================================
   完整课表查看模式
   ===================================================== */

function renderViewModeButtons() {
    const container = document.getElementById("viewModeButtons");
    container.innerHTML = "";

    const modes = [
        { value: "class", label: "当前班级" },
        { value: "all", label: "所有人" }
    ];

    modes.forEach(mode => {
        const button = document.createElement("button");
        button.className = "day-button";

        if (mode.value === selectedViewMode) {
            button.classList.add("active");
        }

        button.textContent = mode.label;
        button.onclick = async function() {
            selectedViewMode = mode.value;
            renderViewModeButtons();

            if (selectedViewMode === "all" && !allSchedulesLoaded) {
                await loadAllSchedules();
            }

            renderFullTimetable();
        };

        container.appendChild(button);
    });
}


/* =====================================================
   完整课表星期按钮
   ===================================================== */

function renderViewDays() {'''
          replace_once(marker, addition)

          start = text.index("function renderFullTimetable() {")
          end_marker = "\n\n\n/* =====================================================\n   编辑星期按钮"
          end = text.index(end_marker, start)

          new_render = '''function renderFullTimetable() {
    const container = document.getElementById("fullTimetable");
    let courses = [];

    if (selectedViewMode === "all") {
        if (!allSchedulesLoaded) {
            container.innerHTML = `<div class="no-course">正在读取所有人的课表...</div>`;
            loadAllSchedules().then(renderFullTimetable);
            return;
        }

        classList.forEach(classInfo => {
            const classSchedule = allSchedules[classInfo.name];
            const dayCourses = classSchedule && classSchedule[selectedViewDay]
                ? classSchedule[selectedViewDay]
                : [];

            dayCourses.forEach(course => {
                courses.push({ ...course, className: classInfo.name });
            });
        });

        courses.sort((a, b) =>
            a.start - b.start ||
            a.end - b.end ||
            a.className.localeCompare(b.className)
        );
    }
    else {
        courses = (schedule[selectedViewDay] || []).map(course => ({
            ...course,
            className: currentClass
        }));
    }

    if (courses.length === 0) {
        container.innerHTML = `<div class="no-course">今天没有课程</div>`;
        return;
    }

    container.innerHTML = "";

    courses.forEach(course => {
        const div = document.createElement("div");
        div.className = "full-course";

        const classLabel = selectedViewMode === "all"
            ? `　👥 ${escapeHTML(course.className)}`
            : "";

        div.innerHTML = `
            <div class="full-course-subject">${escapeHTML(course.subject)}</div>
            <div class="full-course-info">
                🕐 ${courseTime(course)}${classLabel}<br>
                📍 ${escapeHTML(course.location)}
            </div>
        `;

        container.appendChild(div);
    });
}
'''
          text = text[:start] + new_render + text[end:]

          replace_once(
              "    savePersonalSchedule();\n\n    update();",
              "    savePersonalSchedule();\n\n    allSchedulesLoaded = false;\n\n    update();"
          )

          replace_once(
              "        localStorage.removeItem(\n\n            \"myTimetable_\" +\n            currentClass\n\n        );\n\n\n        update();",
              "        localStorage.removeItem(\n\n            \"myTimetable_\" +\n            currentClass\n\n        );\n\n\n        allSchedulesLoaded = false;\n\n        update();"
          )

          replace_once(
              "    renderViewDays();\n\n}\n\n\n/* =====================================================\n   打开编辑器",
              "    renderViewModeButtons();\n\n    renderViewDays();\n\n}\n\n\n/* =====================================================\n   打开编辑器"
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit website update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add all-classes timetable view"
          git push origin HEAD:main
