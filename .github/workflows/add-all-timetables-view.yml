name: Add all timetables view

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-all-timetables-view.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        run: python scripts/patch-all-timetables-view.py

      - name: Commit website update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add all-classes timetable view"
          git push origin HEAD:main
