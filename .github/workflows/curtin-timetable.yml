name: Curtin timetable check

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 Malaysia time (UTC+8)
    - cron: "0 10 * * *" # 18:00 Malaysia time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check Curtin timetable
        run: node scripts/check-curtin-timetable.mjs

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- "关注塔菲喵/1E1.json" "关注塔菲喵/1E8.json" "关注塔菲喵/last-updated.json"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove temporary dependencies
        run: rm -rf node_modules

      - name: Publish timetable changes
        if: steps.changes.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "关注塔菲喵/1E1.json" "关注塔菲喵/1E8.json" "关注塔菲喵/last-updated.json"
          git commit -m "Update Curtin timetables"
          git push origin HEAD:main
