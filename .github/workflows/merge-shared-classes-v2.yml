name: Merge shared timetable classes v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-shared-classes-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 scripts/merge-shared-classes-v2.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Merge identical courses across classes in all view"
          git push
