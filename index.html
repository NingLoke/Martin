<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>📖 My Timetable</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: #222;
}

.card {
    position: relative;
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    margin-top: 0;
    margin-bottom: 12px;
}

.time {
    color: #666;
    margin-bottom: 8px;
}

.time-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.time-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.time-stack .time {
    margin-bottom: 0;
}

.last-updated {
    color: #888;
    font-size: 12px;
    margin-bottom: 8px;
    text-align: right;
}

.status {
    font-size: 26px;
    font-weight: bold;
    margin: 20px 0;
}

/* 班级选择 */

/* 班级选择 */

.top-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: nowrap;
}

.class-select {
    width: 70px;
    height: 34px;
    padding: 5px;
    border: 1px solid #ddd;
    border-radius: 9px;
    background: white;
    font-size: 13px;
    font-weight: bold;
    flex-shrink: 0;
}

.main-button {
    border: none;
    border-radius: 9px;
    padding: 8px 10px;
    background: #f1f3f5;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}
/* 首页课程 */

.info {
    background: #f1f3f5;
    padding: 18px;
    border-radius: 15px;
}

.course {
    margin-bottom: 25px;
}

.course:last-child {
    margin-bottom: 0;
}

.past {
    opacity: 0.35;
}

.label {
    color: #777;
    font-size: 13px;
    margin-top: 10px;
}

.value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.countdown {
    font-size: 28px;
    font-weight: bold;
    margin-top: 5px;
}

/* 按钮 */

.buttons {
    position: absolute;
    top: 18px;
    left: 100px;
    display: flex;
    gap: 6px;
    margin: 0;
    z-index: 10;
}
.main-button {
    border: none;
    border-radius: 9px;
    padding: 8px 10px;
    background: #f1f3f5;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}
.main-button:active {
    transform: scale(0.97);
}

/* 弹窗 */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    padding: 20px;
    z-index: 1000;
    overflow-y: auto;
}

.modal-box {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.modal-header h2 {
    margin: 0;
}

.close-button {
    border: none;
    background: #f1f3f5;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

/* 星期按钮 */

.day-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 18px;
}

.day-button {
    border: none;
    padding: 9px 4px;
    border-radius: 10px;
    background: #f1f3f5;
    cursor: pointer;
    font-weight: bold;
}

.day-button.active {
    background: #222;
    color: white;
}

.view-mode-buttons {
    grid-template-columns: repeat(2, 1fr);
    margin-bottom: 10px;
}

/* 完整课表 */

.full-course {
    background: #f5f6f7;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 10px;
}

.full-course-subject {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.full-course-info {
    color: #666;
    font-size: 14px;
    line-height: 1.7;
}

.no-course {
    text-align: center;
    color: #888;
    padding: 30px 10px;
}

/* 编辑器 */

.editor-course {
    background: #f5f6f7;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 12px;
}

.editor-title {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 12px;
}

.input-group {
    margin-bottom: 10px;
}

.input-group label {
    display: block;
    font-size: 13px;
    color: #777;
    margin-bottom: 5px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
}

.time-row {
    display: flex;
    gap: 8px;
}

.time-row .input-group {
    flex: 1;
}

/* 编辑器按钮 */

.delete-button {
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 10px;
    background: #ffe5e5;
    color: #c62828;
    font-weight: bold;
    cursor: pointer;
}

.add-button {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 13px;
    background: #222;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.save-button {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 13px;
    background: #e8f5e9;
    color: #2e7d32;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.reset-button {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 11px;
    background: #f1f3f5;
    color: #555;
    cursor: pointer;
    margin-top: 10px;
}

</style>

</head>

<body>

<!-- 首页 -->

<div class="card">

    <div class="top-tools">

        <select

            <option>
                正在读取班级...

        </select>

        <button

            ✏️ 编辑课表

    </div>

    <h1>📖 My Timetable</h1>
<div class="time-line">
    <div class="time-stack">
        <div
            class="time"
            id="date">
        </div>

        <div
            class="time"
            id="clock">
        </div>
    </div>

    <div class="last-updated time-stack">
        <div>课表每日同步两次</div>
        <div id="lastUpdated">
            上次检查时间读取中...
        </div>

</div>

<div
    class="status"
    id="status">

    正在读取课表...

</div>

<div id="details"></div>

    <!-- 班级选择 -->

   

<!-- 完整课表 -->

<div
    class="modal"
    id="timetableModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                📅 完整课表
            </h2>

            <button
                class="close-button"
                onclick="closeModal('timetableModal')">

                ×

            </button>

        </div>

        <div
            class="day-buttons view-mode-buttons"
            id="viewModeButtons">
        </div>

        <div
            class="day-buttons"
            id="viewDayButtons">
        </div>

        <div
            id="fullTimetable">
        </div>

    </div>

</div>


<!-- 编辑课表 -->

<div
    class="modal"
    id="editorModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                ✏️ 编辑课表
            </h2>

            <button
                class="close-button"
                onclick="closeModal('editorModal')">

                ×

            </button>

        </div>

        <div
            class="day-buttons"
            id="editDayButtons">
        </div>

        <div id="editor"></div>

        <button
            class="add-button"
            onclick="addCourse()">

            ＋ 增加课程

        </button>

        <button
            class="save-button"
            onclick="saveSchedule()">

            💾 保存修改

        </button>

        <button
            class="reset-button"
            onclick="resetSchedule()">

            ↩️ 恢复班级默认课表

        </button>

    </div>

</div>


<script>

/* =====================================================
   空白默认课表
   ===================================================== */

const defaultSchedule = {

    0: [],
    1: [],
    2: [],
    3: [],
    4: [],
    5: [],
    6: []

};


/* =====================================================
   星期
   ===================================================== */

const dayNames = [

    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六",
    "星期日"

];


/* =====================================================
   全局变量
   ===================================================== */

let classList = [];

let currentClass = "";

let schedule =
    JSON.parse(
        JSON.stringify(defaultSchedule)
    );

let selectedViewDay = 0;

let selectedViewMode = "class";

let allSchedules = {};

let allSchedulesLoaded = false;

let selectedEditDay = 0;


/* =====================================================
   HTML 安全处理
   ===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   复制课表
   ===================================================== */

function copySchedule(data) {

    return JSON.parse(
        JSON.stringify(data)
    );

}


/* =====================================================
   从 localStorage 读取个人修改
   ===================================================== */

function loadPersonalSchedule(className) {

    const key =
        "myTimetable_" + className;

    const saved =
        localStorage.getItem(key);

    if (saved) {

        try {

            return JSON.parse(saved);

        }

        catch {

            return copySchedule(
                defaultSchedule
            );

        }

    }

    return null;

}


/* =====================================================
   保存个人课表
   ===================================================== */

function savePersonalSchedule() {

    const key =
        "myTimetable_" + currentClass;

    localStorage.setItem(

        key,

        JSON.stringify(schedule)

    );

}


/* =====================================================
   读取班级 JSON
   ===================================================== */

async function loadClass(className) {

    currentClass = className;

    document.getElementById(
        "status"
    ).textContent =
        "正在读取 " + className + "...";

    try {

        const classInfo =
            classList.find(

                item =>
                    item.name === className

            );

        if (!classInfo) {

            throw new Error(
                "找不到班级"
            );

        }

        const response =
            await fetch(
                classInfo.file
            );

        if (!response.ok) {

            throw new Error(
                "无法读取 " +
                classInfo.file
            );

        }

        const data =
            await response.json();


        /*
           如果之前修改过这个班级，
           使用个人版本。

           如果没有修改，
           使用 JSON 默认课表。
        */

        const personal =
            loadPersonalSchedule(
                className
            );

        if (personal) {

            schedule =
                personal;

        }

        else {

            schedule =
                copySchedule(data);

        }


        update();

        renderViewDays();

        renderEditDays();

    }

    catch (error) {

        console.error(error);

        schedule =
            copySchedule(
                defaultSchedule
            );

        document.getElementById(
            "status"
        ).textContent =
            "❌ 无法读取 " + className;

    }

}


/* =====================================================
   读取 classes.json
   ===================================================== */

async function loadClasses() {

    try {

        const response =
            await fetch(
                "/Martin/关注塔菲喵/classes.json"
            );

        if (!response.ok) {

            throw new Error(
                "无法读取 classes.json"
            );

        }

        classList =
            await response.json();

        const select =
            document.getElementById(
                "classSelect"
            );

        select.innerHTML = "";


        classList.forEach(

            item => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    item.name;

                option.textContent =
                    item.name;

                select.appendChild(
                    option
                );

            }

        );


        if (
            classList.length === 0
        ) {

            throw new Error(
                "没有班级"
            );

        }


        const defaultClass =
            classList.find(

                item =>
                    item.name === "1E8"

            );


        const firstClass =

            defaultClass

            ? defaultClass.name

            : classList[0].name;


        select.value =
            firstClass;


        await loadClass(
            firstClass
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "❌ 无法读取班级列表";

    }

}


/* =====================================================
   切换班级
   ===================================================== */

async function changeClass() {

    const select =
        document.getElementById(
            "classSelect"
        );

    const className =
        select.value;

    localStorage.setItem(
        "selectedClass",
        className
    );

    await loadClass(
        className
    );

}


/* =====================================================
   时间 → HH:MM
   ===================================================== */

function clockTime(minutes) {

    const hours =
        Math.floor(
            minutes / 60
        );

    const mins =
        minutes % 60;

    return (

        String(hours)
            .padStart(2, "0")

        +

        ":"

        +

        String(mins)
            .padStart(2, "0")

    );

}


/* =====================================================
   课程时间
   ===================================================== */

function courseTime(course) {

    return (

        clockTime(course.start)

        +

        " - "

        +

        clockTime(course.end)

    );

}


/* =====================================================
   HH:MM → 分钟
   ===================================================== */

function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (

        Number(parts[0]) * 60

        +

        Number(parts[1])

    );

}


/* =====================================================
   倒计时
   ===================================================== */

function formatTime(totalMinutes) {

    const totalSeconds =

        Math.max(

            0,

            Math.ceil(
                totalMinutes * 60
            )

        );

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(

            (totalSeconds % 3600)
            / 60

        );

    const seconds =
        totalSeconds % 60;

    let result = "";


    if (hours > 0) {

        result +=
            hours + "小时 ";

    }


    if (
        minutes > 0 ||
        hours > 0
    ) {

        result +=
            minutes + "分钟 ";

    }


    result +=
        seconds + "秒";


    return result.trim();

}


/* =====================================================
   找未来最近上课日
   ===================================================== */

function findFutureDay(day) {

    for (

        let offset = 1;

        offset <= 7;

        offset++

    ) {

        const futureDay =
            (day + offset) % 7;

        if (
            schedule[futureDay] &&
            schedule[futureDay].length > 0
        ) {

            return {

                day: futureDay,

                offset: offset

            };

        }

    }

    return null;

}


/* =====================================================
   未来课程倒计时
   ===================================================== */

function futureCountdown(

    currentTime,
    courseStart,
    offset

) {

    return (

        (1440 - currentTime)

        +

        ((offset - 1) * 1440)

        +

        courseStart

    );

}


/* =====================================================
   首页课程
   ===================================================== */

function makeCourseHTML(

    course,
    distance,
    highlight,
    past

) {

    let className =
        "course";

    if (past) {

        className +=
            " past";

    }

    let html = `

        <div class="${className}">

    `;


    if (past) {

        html += `

            <div class="label">
                已结束
            </div>

        `;

    }

    else if (highlight) {

        html += `

            <div class="label">
                下一堂课
            </div>

        `;

    }

    else {

        html += `

            <div class="label">
                课程
            </div>

        `;

    }


    html += `

        <div class="value">
            ${escapeHTML(course.subject)}
        </div>

        <div class="label">
            时间
        </div>

        <div class="value">
            ${courseTime(course)}
        </div>

        <div class="label">
            地点
        </div>

        <div class="value">
            ${escapeHTML(course.location)}
        </div>

    `;


    if (
        !past &&
        distance !== null
    ) {

        html += `

            <div class="label">
                距离
            </div>

            <div class="countdown">
                ${formatTime(distance)}
            </div>

        `;

    }


    html += `

        </div>

    `;


    return html;

}


/* =====================================================
   首页更新
   ===================================================== */

function update() {

    const now =
        new Date();

    const jsDay =
        now.getDay();

    /*
       JS:
       Sunday = 0

       转换：
       Monday = 0
       Tuesday = 1
       ...
       Sunday = 6
    */

    const day =
        (jsDay + 6) % 7;

    const hour =
        now.getHours();

    const minute =
        now.getMinutes();

    const second =
        now.getSeconds();

    const time =

        hour * 60

        +

        minute

        +

        second / 60;


    document.getElementById(
        "date"
    ).textContent =
        dayNames[day];


    document.getElementById(
        "clock"
    ).textContent =

        String(hour)
            .padStart(2, "0")

        +

        ":"

        +

        String(minute)
            .padStart(2, "0")

        +

        ":"

        +

        String(second)
            .padStart(2, "0");


    const today =
        schedule[day] || [];


    /* 正在上课 */

    const currentIndex =
        today.findIndex(

            course =>

                time >= course.start

                &&

                time < course.end

        );


    if (
        currentIndex !== -1
    ) {

        const current =
            today[currentIndex];


        document.getElementById(
            "status"
        ).textContent =
            "📖 现在上课";


        let html = `

            <div class="info">

        `;


        html +=
            makeCourseHTML(

                current,

                current.end - time,

                true,

                false

            );


        today.forEach(

            (course, index) => {

                if (
                    index === currentIndex
                ) {

                    return;

                }


                if (
                    time >= course.end
                ) {

                    html +=
                        makeCourseHTML(

                            course,
                            null,
                            false,
                            true

                        );

                }

                else {

                    html +=
                        makeCourseHTML(

                            course,
                            course.start - time,
                            false,
                            false

                        );

                }

            }

        );


        html += `

            </div>

        `;


        document.getElementById(
            "details"
        ).innerHTML =
            html;


        return;

    }


    /* 今天还有课程 */

    const nextIndex =
        today.findIndex(

            course =>
                course.start > time

        );


    if (
        nextIndex !== -1
    ) {

        const next =
            today[nextIndex];


        document.getElementById(
            "status"
        ).textContent =

            "距离 "

            +

            next.subject

            +

            " 还有 "

            +

            formatTime(

                next.start - time

            );


        let html = `

            <div class="info">

        `;


        html +=
            makeCourseHTML(

                next,

                next.start - time,

                true,

                false

            );


        today.forEach(

            (course, index) => {

                if (
                    index === nextIndex
                ) {

                    return;

                }


                if (
                    time >= course.end
                ) {

                    html +=
                        makeCourseHTML(

                            course,
                            null,
                            false,
                            true

                        );

                }

                else {

                    html +=
                        makeCourseHTML(

                            course,
                            course.start - time,
                            false,
                            false

                        );

                }

            }

        );


        html += `

            </div>

        `;


        document.getElementById(
            "details"
        ).innerHTML =
            html;


        return;

    }


    /* 今天彻底没有课程 */

    const future =
        findFutureDay(day);


    if (
        future === null
    ) {

        document.getElementById(
            "status"
        ).textContent =
            "自由！";

        document.getElementById(
            "details"
        ).innerHTML =
            "";

        return;

    }


    const futureDay =
        future.day;

    const offset =
        future.offset;

    const futureSchedule =
        schedule[futureDay];


    document.getElementById(
        "status"
    ).textContent =
        "自由！";


    let html = `

        <div class="info">

            <div class="label">
                下一上课日
            </div>

            <div class="value">
                ${dayNames[futureDay]}
            </div>

    `;


    futureSchedule.forEach(

        (course, index) => {

            const distance =

                futureCountdown(

                    time,
                    course.start,
                    offset

                );


            html +=
                makeCourseHTML(

                    course,
                    distance,
                    index === 0,
                    false

                );

        }

    );


    html += `

        </div>

    `;


    document.getElementById(
        "details"
    ).innerHTML =
        html;

}


/* =====================================================
   读取所有班级课表
   ===================================================== */

async function loadAllSchedules() {
    const loaded = {};

    for (const classInfo of classList) {
        const personal = loadPersonalSchedule(classInfo.name);

        if (personal) {
            loaded[classInfo.name] = copySchedule(personal);
            continue;
        }

        try {
            const response = await fetch(classInfo.file);
            if (!response.ok) throw new Error("无法读取 " + classInfo.file);
            loaded[classInfo.name] = await response.json();
        }
        catch (error) {
            console.error(error);
            loaded[classInfo.name] = copySchedule(defaultSchedule);
        }
    }

    allSchedules = loaded;
    allSchedulesLoaded = true;
}


/* =====================================================
   完整课表查看模式
   ===================================================== */

function renderViewModeButtons() {
    const container = document.getElementById("viewModeButtons");
    container.innerHTML = "";

    const modes = [
        { value: "class", label: "当前班级" },
        { value: "all", label: "所有人" }
    ];

    modes.forEach(mode => {
        const button = document.createElement("button");
        button.className = "day-button";

        if (mode.value === selectedViewMode) {
            button.classList.add("active");
        }

        button.textContent = mode.label;
        button.onclick = async function() {
            selectedViewMode = mode.value;
            renderViewModeButtons();

            if (selectedViewMode === "all" && !allSchedulesLoaded) {
                await loadAllSchedules();
            }

            renderFullTimetable();
        };

        container.appendChild(button);
    });
}


/* =====================================================
   完整课表星期按钮
   ===================================================== */

function renderViewDays() {

    const container =
        document.getElementById(
            "viewDayButtons"
        );

    container.innerHTML = "";


    dayNames.forEach(

        (dayName, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "day-button";


            if (
                index === selectedViewDay
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                dayName;


            button.onclick = function() {

                selectedViewDay =
                    index;

                renderViewDays();

            };


            container.appendChild(
                button
            );

        }

    );


    renderFullTimetable();

}


/* =====================================================
   显示完整课表
   ===================================================== */

function renderFullTimetable() {
    const container = document.getElementById("fullTimetable");
    let courses = [];

    if (selectedViewMode === "all") {
        if (!allSchedulesLoaded) {
            container.innerHTML = `<div class="no-course">正在读取所有人的课表...</div>`;
            loadAllSchedules().then(renderFullTimetable);
            return;
        }

        classList.forEach(classInfo => {
            const classSchedule = allSchedules[classInfo.name];
            const dayCourses = classSchedule && classSchedule[selectedViewDay]
                ? classSchedule[selectedViewDay]
                : [];

            dayCourses.forEach(course => {
                courses.push({ ...course, className: classInfo.name });
            });
        });

        courses.sort((a, b) =>
            a.start - b.start ||
            a.end - b.end ||
            a.className.localeCompare(b.className)
        );
    }
    else {
        courses = (schedule[selectedViewDay] || []).map(course => ({
            ...course,
            className: currentClass
        }));
    }

    if (courses.length === 0) {
        container.innerHTML = `<div class="no-course">今天没有课程</div>`;
        return;
    }

    container.innerHTML = "";

    courses.forEach(course => {
        const div = document.createElement("div");
        div.className = "full-course";

        const classLabel = selectedViewMode === "all"
            ? `　👥 ${escapeHTML(course.className)}`
            : "";

        div.innerHTML = `
            <div class="full-course-subject">${escapeHTML(course.subject)}</div>
            <div class="full-course-info">
                🕐 ${courseTime(course)}${classLabel}<br>
                📍 ${escapeHTML(course.location)}
            </div>
        `;

        container.appendChild(div);
    });
}



/* =====================================================
   编辑星期按钮
   ===================================================== */

function renderEditDays() {

    const container =
        document.getElementById(
            "editDayButtons"
        );

    container.innerHTML = "";


    dayNames.forEach(

        (dayName, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "day-button";


            if (
                index === selectedEditDay
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                dayName;


            button.onclick = function() {

                selectedEditDay =
                    index;

                renderEditDays();

            };


            container.appendChild(
                button
            );

        }

    );


    renderEditor();

}


/* =====================================================
   编辑器
   ===================================================== */

function renderEditor() {

    const container =
        document.getElementById(
            "editor"
        );


    const courses =
        schedule[selectedEditDay] || [];


    container.innerHTML = "";


    if (
        courses.length === 0
    ) {

        container.innerHTML = `

            <div class="no-course">
                今天没有课程
            </div>

        `;

        return;

    }


    courses.forEach(

        (course, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "editor-course";


            div.innerHTML = `

                <div class="editor-title">

                    课程 ${index + 1}

                </div>


                <div class="input-group">

                    <label>
                        科目
                    </label>

                    <input
                        type="text"
                        value="${escapeHTML(
                            course.subject
                        )}"
                        onchange="
                            updateSubject(
                                ${index},
                                this.value
                            )
                        "
                    >

                </div>


                <div class="time-row">

                    <div class="input-group">

                        <label>
                            开始
                        </label>

                        <input
                            type="time"
                            value="${clockTime(
                                course.start
                            )}"
                            onchange="
                                updateStart(
                                    ${index},
                                    this.value
                                )
                            "
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            结束
                        </label>

                        <input
                            type="time"
                            value="${clockTime(
                                course.end
                            )}"
                            onchange="
                                updateEnd(
                                    ${index},
                                    this.value
                                )
                            "
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label>
                        地点
                    </label>

                    <input
                        type="text"
                        value="${escapeHTML(
                            course.location
                        )}"
                        onchange="
                            updateLocation(
                                ${index},
                                this.value
                            )
                        "
                    >

                </div>


                <button
                    class="delete-button"
                    onclick="
                        deleteCourse(
                            ${index}
                        )
                    ">

                    🗑️ 删除课程

                </button>

            `;


            container.appendChild(
                div
            );

        }

    );

}


/* =====================================================
   修改课程
   ===================================================== */

function updateSubject(index, value) {

    schedule[selectedEditDay][index].subject =
        value;

}


function updateLocation(index, value) {

    schedule[selectedEditDay][index].location =
        value;

}


function updateStart(index, value) {

    schedule[selectedEditDay][index].start =
        timeToMinutes(value);

}


function updateEnd(index, value) {

    schedule[selectedEditDay][index].end =
        timeToMinutes(value);

}


/* =====================================================
   增加课程
   ===================================================== */

function addCourse() {

    schedule[selectedEditDay].push({

        start: 480,

        end: 540,

        subject: "新课程",

        location: "地点"

    });


    renderEditor();

}


/* =====================================================
   删除课程
   ===================================================== */

function deleteCourse(index) {

    schedule[selectedEditDay].splice(
        index,
        1
    );

    renderEditor();

}


/* =====================================================
   保存修改
   ===================================================== */

function saveSchedule() {

    savePersonalSchedule();

    allSchedulesLoaded = false;

    update();

    renderFullTimetable();

    alert(
        "✅ " +
        currentClass +
        " 课表已保存"
    );

}


/* =====================================================
   恢复默认 JSON 课表
   ===================================================== */

async function resetSchedule() {

    if (
        !confirm(
            "确定要恢复 " +
            currentClass +
            " 的默认课表吗？"
        )
    ) {

        return;

    }


    try {

        const classInfo =
            classList.find(

                item =>
                    item.name === currentClass

            );


        const response =
            await fetch(
                classInfo.file
            );


        const data =
            await response.json();


        schedule =
            copySchedule(data);


        localStorage.removeItem(

            "myTimetable_" +
            currentClass

        );


        allSchedulesLoaded = false;

        update();

        renderEditor();

        renderFullTimetable();


        alert(
            "✅ 已恢复默认课表"
        );

    }

    catch {

        alert(
            "❌ 无法读取默认课表"
        );

    }

}


/* =====================================================
   打开完整课表
   ===================================================== */

function openTimetable() {

    document.getElementById(
        "timetableModal"
    ).style.display =
        "block";


    renderViewModeButtons();

    renderViewDays();

}


/* =====================================================
   打开编辑器
   ===================================================== */

function openEditor() {

    document.getElementById(
        "editorModal"
    ).style.display =
        "block";


    renderEditDays();

}


/* =====================================================
   关闭弹窗
   ===================================================== */

function closeModal(id) {

    document.getElementById(
        id
    ).style.display =
        "none";

}


/* =====================================================
   点击背景关闭
   ===================================================== */

window.onclick = function(event) {

    if (
        event.target.classList.contains(
            "modal"
        )
    ) {

        event.target.style.display =
            "none";

    }

};


/* =====================================================
   课表上次检查时间
   ===================================================== */

async function loadLastUpdated() {

    const element =
        document.getElementById(
            "lastUpdated"
        );

    try {

        const response =
            await fetch(
                "/Martin/关注塔菲喵/last-updated.json",
                { cache: "no-store" }
            );

        if (!response.ok) {
            throw new Error(
                "无法读取更新时间"
            );
        }

        const data =
            await response.json();

        const updatedAt =
            new Date(data.updatedAt);

        element.textContent =
            "上次检查时间 " +
            updatedAt.toLocaleString(
                "zh-CN",
                {
                    timeZone: "Asia/Kuala_Lumpur",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: false
                }
            );

    }

    catch (error) {

        console.error(error);

        element.textContent =
            "上次检查时间暂无记录";

    }

}


/* =====================================================
   启动
   ===================================================== */

loadClasses();

loadLastUpdated();


/* =====================================================
   每秒更新
   ===================================================== */

setInterval(

    update,

    1000

);

</script>

</body>
