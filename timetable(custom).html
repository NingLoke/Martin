<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>📖 My Timetable</title>


<style>

/* =====================================================
   基础
   ===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: #f4f6f8;

    display: flex;

    justify-content: center;

    padding: 20px;

    color: #222;
}


/* =====================================================
   主卡片
   ===================================================== */

.card {

    width: 100%;

    max-width: 500px;

    background: white;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
}


h1 {

    margin-top: 0;

    margin-bottom: 12px;
}


.time {

    color: #666;

    margin-bottom: 8px;
}


.status {

    font-size: 26px;

    font-weight: bold;

    margin: 20px 0;
}


/* =====================================================
   首页课程信息
   ===================================================== */

.info {

    background: #f1f3f5;

    padding: 18px;

    border-radius: 15px;
}


.course {

    margin-bottom: 25px;
}


.course:last-child {

    margin-bottom: 0;
}


.past {

    opacity: 0.35;
}


.label {

    color: #777;

    font-size: 13px;

    margin-top: 10px;
}


.value {

    font-size: 20px;

    font-weight: bold;

    margin-top: 4px;
}


.countdown {

    font-size: 28px;

    font-weight: bold;

    margin-top: 5px;
}


/* =====================================================
   首页按钮
   ===================================================== */

.buttons {

    display: flex;

    gap: 10px;

    margin-top: 20px;
}


.main-button {

    flex: 1;

    border: none;

    border-radius: 12px;

    padding: 13px 10px;

    background: #f1f3f5;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}


.main-button:hover {

    background: #e2e5e8;
}


.main-button:active {

    transform: scale(0.97);
}


/* =====================================================
   弹窗
   ===================================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.45);

    padding: 20px;

    z-index: 1000;

    overflow-y: auto;
}


.modal-box {

    width: 100%;

    max-width: 500px;

    margin: 20px auto;

    background: white;

    border-radius: 20px;

    padding: 22px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.2);
}


.modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}


.modal-header h2 {

    margin: 0;
}


.close-button {

    border: none;

    background: #f1f3f5;

    width: 38px;

    height: 38px;

    border-radius: 50%;

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   星期按钮
   ===================================================== */

.day-buttons {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    margin-bottom: 18px;
}


.day-button {

    border: none;

    padding: 9px 4px;

    border-radius: 10px;

    background: #f1f3f5;

    cursor: pointer;

    font-weight: bold;
}


.day-button.active {

    background: #222;

    color: white;
}


/* =====================================================
   完整课表
   ===================================================== */

.full-course {

    background: #f5f6f7;

    border-radius: 13px;

    padding: 15px;

    margin-bottom: 10px;
}


.full-course-subject {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;
}


.full-course-info {

    color: #666;

    font-size: 14px;

    line-height: 1.7;
}


.no-course {

    text-align: center;

    color: #888;

    padding: 30px 10px;
}


/* =====================================================
   编辑器
   ===================================================== */

.editor-course {

    background: #f5f6f7;

    border-radius: 15px;

    padding: 15px;

    margin-bottom: 12px;
}


.editor-title {

    font-weight: bold;

    font-size: 16px;

    margin-bottom: 12px;
}


.input-group {

    margin-bottom: 10px;
}


.input-group label {

    display: block;

    font-size: 13px;

    color: #777;

    margin-bottom: 5px;
}


.input-group input {

    width: 100%;

    padding: 10px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 15px;
}


.time-row {

    display: flex;

    gap: 8px;
}


.time-row .input-group {

    flex: 1;
}


/* =====================================================
   编辑器按钮
   ===================================================== */

.delete-button {

    width: 100%;

    border: none;

    border-radius: 9px;

    padding: 10px;

    background: #ffe5e5;

    color: #c62828;

    font-weight: bold;

    cursor: pointer;
}


.add-button {

    width: 100%;

    border: none;

    border-radius: 11px;

    padding: 13px;

    background: #222;

    color: white;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}


.save-button {

    width: 100%;

    border: none;

    border-radius: 11px;

    padding: 13px;

    background: #e8f5e9;

    color: #2e7d32;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;
}


.reset-button {

    width: 100%;

    border: none;

    border-radius: 11px;

    padding: 11px;

    background: #f1f3f5;

    color: #555;

    cursor: pointer;

    margin-top: 10px;
}


</style>

</head>


<body>


<!-- =====================================================
     首页
     ===================================================== -->

<div class="card">

    <h1>📖 My Timetable</h1>


    <div
        class="time"
        id="date">
    </div>


    <div
        class="time"
        id="clock">
    </div>


    <div
        class="status"
        id="status">
    </div>


    <div id="details"></div>


    <div class="buttons">

        <button
            class="main-button"
            onclick="openTimetable()">

            📅 完整课表

        </button>


        <button
            class="main-button"
            onclick="openEditor()">

            ✏️ 编辑课表

        </button>

    </div>

</div>



<!-- =====================================================
     完整课表
     ===================================================== -->

<div
    class="modal"
    id="timetableModal">


    <div class="modal-box">


        <div class="modal-header">

            <h2>
                📅 完整课表
            </h2>


            <button
                class="close-button"
                onclick="
                    closeModal('timetableModal')
                ">

                ×

            </button>

        </div>


        <div
            class="day-buttons"
            id="viewDayButtons">
        </div>


        <div
            id="fullTimetable">
        </div>


    </div>

</div>



<!-- =====================================================
     编辑课表
     ===================================================== -->

<div
    class="modal"
    id="editorModal">


    <div class="modal-box">


        <div class="modal-header">

            <h2>
                ✏️ 编辑课表
            </h2>


            <button
                class="close-button"
                onclick="
                    closeModal('editorModal')
                ">

                ×

            </button>

        </div>


        <div
            class="day-buttons"
            id="editDayButtons">
        </div>


        <div id="editor"></div>


        <button
            class="add-button"
            onclick="addCourse()">

            ＋ 增加课程

        </button>


        <button
            class="save-button"
            onclick="saveSchedule()">

            💾 保存修改

        </button>


        <button
            class="reset-button"
            onclick="resetSchedule()">

            ↩️ 清空我的课表

        </button>


    </div>

</div>



<script>


/* =====================================================
   空白课表
   ===================================================== */

const defaultSchedule = {

    0: [],   // 星期一

    1: [],   // 星期二

    2: [],   // 星期三

    3: [],   // 星期四

    4: [],   // 星期五

    5: [],   // 星期六

    6: []    // 星期日

};



/* =====================================================
   从浏览器读取个人课表
   ===================================================== */

let savedSchedule =
    localStorage.getItem(
        "myTimetable"
    );


let schedule;


if (savedSchedule) {

    schedule =
        JSON.parse(savedSchedule);

}

else {

    schedule =
        JSON.parse(
            JSON.stringify(
                defaultSchedule
            )
        );

}



/* =====================================================
   星期名称
   ===================================================== */

const dayNames = [

    "星期一",

    "星期二",

    "星期三",

    "星期四",

    "星期五",

    "星期六",

    "星期日"

];



/* =====================================================
   时间 → HH:MM
   ===================================================== */

function clockTime(minutes) {

    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (

        String(hours)
            .padStart(2, "0")

        +

        ":"

        +

        String(mins)
            .padStart(2, "0")

    );

}



/* =====================================================
   课程时间
   ===================================================== */

function courseTime(course) {

    return (

        clockTime(course.start)

        +

        " - "

        +

        clockTime(course.end)

    );

}



/* =====================================================
   HH:MM → 分钟
   ===================================================== */

function timeToMinutes(time) {

    const parts =
        time.split(":");


    return (

        Number(parts[0]) * 60

        +

        Number(parts[1])

    );

}



/* =====================================================
   倒计时格式
   ===================================================== */

function formatTime(totalMinutes) {


    const totalSeconds =

        Math.max(

            0,

            Math.ceil(
                totalMinutes * 60
            )

        );


    const hours =

        Math.floor(
            totalSeconds / 3600
        );


    const minutes =

        Math.floor(

            (totalSeconds % 3600)
            / 60

        );


    const seconds =

        totalSeconds % 60;


    let result = "";


    if (hours > 0) {

        result +=
            hours + "小时 ";

    }


    if (
        minutes > 0 ||
        hours > 0
    ) {

        result +=
            minutes + "分钟 ";

    }


    result +=
        seconds + "秒";


    return result.trim();

}



/* =====================================================
   找未来最近的上课日
   ===================================================== */

function findFutureDay(day) {


    for (

        let offset = 1;

        offset <= 7;

        offset++

    ) {


        const futureDay =

            (day + offset) % 7;


        if (
            schedule[futureDay].length > 0
        ) {

            return {

                day: futureDay,

                offset: offset

            };

        }

    }


    return null;

}



/* =====================================================
   计算未来课程倒计时
   ===================================================== */

function futureCountdown(

    currentTime,

    courseStart,

    offset

) {


    return (

        (1440 - currentTime)

        +

        ((offset - 1) * 1440)

        +

        courseStart

    );

}



/* =====================================================
   首页课程 HTML
   ===================================================== */

function makeCourseHTML(

    course,

    distance,

    highlight,

    past

) {


    let className =
        "course";


    if (past) {

        className +=
            " past";

    }


    let html = `

        <div class="${className}">

    `;


    if (past) {

        html += `

            <div class="label">
                已结束
            </div>

        `;

    }

    else if (highlight) {

        html += `

            <div class="label">
                下一堂课
            </div>

        `;

    }

    else {

        html += `

            <div class="label">
                课程
            </div>

        `;

    }


    html += `

        <div class="value">
            ${escapeHTML(course.subject)}
        </div>


        <div class="label">
            时间
        </div>


        <div class="value">
            ${courseTime(course)}
        </div>


        <div class="label">
            地点
        </div>


        <div class="value">
            ${escapeHTML(course.location)}
        </div>

    `;


    if (
        !past &&
        distance !== null
    ) {

        html += `

            <div class="label">
                距离
            </div>


            <div class="countdown">
                ${formatTime(distance)}
            </div>

        `;

    }


    html += `

        </div>

    `;


    return html;

}



/* =====================================================
   首页主程序
   ===================================================== */

function update() {


    const now =
        new Date();


    const jsDay =
        now.getDay();


    /*
       JavaScript：

       Sunday = 0
       Monday = 1
       ...

       转成：

       Monday = 0
       Tuesday = 1
       ...

       Sunday = 6
    */

    const day =
        (jsDay + 6) % 7;


    const hour =
        now.getHours();


    const minute =
        now.getMinutes();


    const second =
        now.getSeconds();


    const time =

        hour * 60

        +

        minute

        +

        second / 60;



    /* =================================================
       日期
       ================================================= */

    document.getElementById(
        "date"
    ).textContent =

        dayNames[day];



    /* =================================================
       时间
       ================================================= */

    document.getElementById(
        "clock"
    ).textContent =

        String(hour)
            .padStart(2, "0")

        +

        ":"

        +

        String(minute)
            .padStart(2, "0")

        +

        ":"

        +

        String(second)
            .padStart(2, "0");



    const today =
        schedule[day];



    /* =================================================
       找正在上的课
       ================================================= */

    const currentIndex =
        today.findIndex(

            course =>

                time >= course.start

                &&

                time < course.end

        );



    /* =================================================
       正在上课
       ================================================= */

    if (
        currentIndex !== -1
    ) {


        const current =
            today[currentIndex];


        document.getElementById(
            "status"
        ).textContent =

            "📖 现在上课";


        let html = `

            <div class="info">

        `;


        html +=
            makeCourseHTML(

                current,

                current.end - time,

                true,

                false

            );


        today.forEach(

            (course, index) => {


                if (
                    index === currentIndex
                ) {

                    return;

                }


                if (
                    time >= course.end
                ) {

                    html +=
                        makeCourseHTML(

                            course,

                            null,

                            false,

                            true

                        );

                }

                else {

                    html +=
                        makeCourseHTML(

                            course,

                            course.start - time,

                            false,

                            false

                        );

                }

            }

        );


        html += `

            </div>

        `;


        document.getElementById(
            "details"
        ).innerHTML = html;


        return;

    }



    /* =================================================
       今天还有课
       ================================================= */

    const nextIndex =
        today.findIndex(

            course =>
                course.start > time

        );


    if (
        nextIndex !== -1
    ) {


        const next =
            today[nextIndex];


        document.getElementById(
            "status"
        ).textContent =

            "距离 "

            +

            next.subject

            +

            " 还有 "

            +

            formatTime(

                next.start - time

            );


        let html = `

            <div class="info">

        `;


        html +=
            makeCourseHTML(

                next,

                next.start - time,

                true,

                false

            );


        today.forEach(

            (course, index) => {


                if (
                    index === nextIndex
                ) {

                    return;

                }


                if (
                    time >= course.end
                ) {

                    html +=
                        makeCourseHTML(

                            course,

                            null,

                            false,

                            true

                        );

                }

                else {

                    html +=
                        makeCourseHTML(

                            course,

                            course.start - time,

                            false,

                            false

                        );

                }

            }

        );


        html += `

            </div>

        `;


        document.getElementById(
            "details"
        ).innerHTML = html;


        return;

    }



    /* =================================================
       今天没有剩余课程
       ================================================= */

    const future =
        findFutureDay(day);


    if (
        future === null
    ) {


        document.getElementById(
            "status"
        ).textContent =

            "自由！";


        document.getElementById(
            "details"
        ).innerHTML = "";


        return;

    }



    const futureDay =
        future.day;


    const offset =
        future.offset;


    const futureSchedule =
        schedule[futureDay];


    document.getElementById(
        "status"
    ).textContent =

        "自由！";


    let html = `

        <div class="info">

            <div class="label">
                下一上课日
            </div>


            <div class="value">
                ${dayNames[futureDay]}
            </div>

    `;


    futureSchedule.forEach(

        (course, index) => {


            const distance =

                futureCountdown(

                    time,

                    course.start,

                    offset

                );


            html +=
                makeCourseHTML(

                    course,

                    distance,

                    index === 0,

                    false

                );

        }

    );


    html += `

        </div>

    `;


    document.getElementById(
        "details"
    ).innerHTML = html;

}



/* =====================================================
   HTML 安全处理
   ===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   关闭弹窗
   ===================================================== */

function closeModal(id) {

    document.getElementById(
        id
    ).style.display = "none";

}



/* =====================================================
   完整课表
   ===================================================== */

let viewDay = 0;



function openTimetable() {


    document.getElementById(
        "timetableModal"
    ).style.display = "block";


    const jsDay =
        new Date().getDay();


    viewDay =
        (jsDay + 6) % 7;


    createViewDayButtons();

    showFullTimetable();

}



function createViewDayButtons() {


    let html = "";


    dayNames.forEach(

        (name, index) => {


            html += `

                <button

                    class="
                        day-button
                        ${index === viewDay
                            ? "active"
                            : ""}
                    "

                    onclick="
                        selectViewDay(
                            ${index}
                        )
                    ">

                    ${name.replace(
                        "星期",
                        ""
                    )}

                </button>

            `;

        }

    );


    document.getElementById(
        "viewDayButtons"
    ).innerHTML = html;

}



function selectViewDay(day) {


    viewDay = day;


    createViewDayButtons();

    showFullTimetable();

}



function showFullTimetable() {


    const courses =
        schedule[viewDay];


    let html = "";


    if (
        courses.length === 0
    ) {


        html = `

            <div class="no-course">

                📭 这一天没有课程

            </div>

        `;

    }

    else {


        courses.forEach(

            course => {


                html += `

                    <div class="full-course">

                        <div
                            class="
                                full-course-subject
                            ">

                            ${escapeHTML(
                                course.subject
                            )}

                        </div>


                        <div
                            class="
                                full-course-info
                            ">

                            🕐
                            ${courseTime(course)}

                            <br>

                            📍
                            ${escapeHTML(
                                course.location
                            )}

                        </div>

                    </div>

                `;

            }

        );

    }


    document.getElementById(
        "fullTimetable"
    ).innerHTML = html;

}



/* =====================================================
   编辑课表
   ===================================================== */

let editDay = 0;



function openEditor() {


    document.getElementById(
        "editorModal"
    ).style.display = "block";


    const jsDay =
        new Date().getDay();


    editDay =
        (jsDay + 6) % 7;


    createEditDayButtons();

    renderEditor();

}



function createEditDayButtons() {


    let html = "";


    dayNames.forEach(

        (name, index) => {


            html += `

                <button

                    class="
                        day-button
                        ${index === editDay
                            ? "active"
                            : ""}
                    "

                    onclick="
                        selectEditDay(
                            ${index}
                        )
                    ">

                    ${name.replace(
                        "星期",
                        ""
                    )}

                </button>

            `;

        }

    );


    document.getElementById(
        "editDayButtons"
    ).innerHTML = html;

}



function selectEditDay(day) {


    editDay = day;


    createEditDayButtons();

    renderEditor();

}



/* =====================================================
   显示编辑器
   ===================================================== */

function renderEditor() {


    const courses =
        schedule[editDay];


    let html = "";


    if (
        courses.length === 0
    ) {


        html += `

            <div class="no-course">

                📭 这一天目前没有课程

            </div>

        `;

    }


    courses.forEach(

        (course, index) => {


            html += `

                <div
                    class="editor-course">


                    <div
                        class="editor-title">

                        第 ${index + 1} 堂课

                    </div>



                    <!-- 课程名称 -->

                    <div
                        class="input-group">

                        <label>
                            课程名称
                        </label>


                        <input

                            type="text"

                            value="${escapeHTML(
                                course.subject
                            )}"

                            onchange="
                                updateSubject(
                                    ${index},
                                    this.value
                                )
                            "

                        >

                    </div>



                    <!-- 地点 -->

                    <div
                        class="input-group">

                        <label>
                            地点
                        </label>


                        <input

                            type="text"

                            value="${escapeHTML(
                                course.location
                            )}"

                            onchange="
                                updateLocation(
                                    ${index},
                                    this.value
                                )
                            "

                        >

                    </div>



                    <!-- 时间 -->

                    <div
                        class="time-row">


                        <div
                            class="input-group">

                            <label>
                                开始
                            </label>


                            <input

                                type="time"

                                value="${clockTime(
                                    course.start
                                )}"

                                onchange="
                                    updateStart(
                                        ${index},
                                        this.value
                                    )
                                "

                            >

                        </div>



                        <div
                            class="input-group">

                            <label>
                                结束
                            </label>


                            <input

                                type="time"

                                value="${clockTime(
                                    course.end
                                )}"

                                onchange="
                                    updateEnd(
                                        ${index},
                                        this.value
                                    )
                                "

                            >

                        </div>


                    </div>



                    <!-- 删除 -->

                    <button

                        class="delete-button"

                        onclick="
                            deleteCourse(
                                ${index}
                            )
                        ">

                        🗑️ 删除这堂课

                    </button>


                </div>

            `;

        }

    );


    document.getElementById(
        "editor"
    ).innerHTML = html;

}



/* =====================================================
   修改课程名称
   ===================================================== */

function updateSubject(
    index,
    value
) {

    schedule[editDay][index].subject =
        value;

}



/* =====================================================
   修改地点
   ===================================================== */

function updateLocation(
    index,
    value
) {

    schedule[editDay][index].location =
        value;

}



/* =====================================================
   修改开始时间
   ===================================================== */

function updateStart(
    index,
    value
) {

    schedule[editDay][index].start =
        timeToMinutes(value);

}



/* =====================================================
   修改结束时间
   ===================================================== */

function updateEnd(
    index,
    value
) {

    schedule[editDay][index].end =
        timeToMinutes(value);

}



/* =====================================================
   增加课程
   ===================================================== */

function addCourse() {


    schedule[editDay].push({

        start: 480,

        end: 540,

        subject: "新课程",

        location: "地点"

    });


    /*
       按开始时间排序
    */

    schedule[editDay].sort(

        (a, b) =>
            a.start - b.start

    );


    renderEditor();

}



/* =====================================================
   删除课程
   ===================================================== */

function deleteCourse(index) {


    if (
        !confirm(
            "确定要删除这堂课吗？"
        )
    ) {

        return;

    }


    schedule[editDay].splice(

        index,

        1

    );


    renderEditor();

}



/* =====================================================
   保存课表
   ===================================================== */

function saveSchedule() {


    localStorage.setItem(

        "myTimetable",

        JSON.stringify(schedule)

    );


    update();


    alert(
        "✅ 课表已经保存！"
    );

}



/* =====================================================
   清空课表
   ===================================================== */

function resetSchedule() {


    if (
        !confirm(
            "确定要清空自己的全部课表吗？"
        )
    ) {

        return;

    }


    schedule =
        JSON.parse(

            JSON.stringify(
                defaultSchedule
            )

        );


    localStorage.removeItem(
        "myTimetable"
    );


    renderEditor();

    update();


    alert(
        "✅ 已经恢复为空白课表！"
    );

}



/* =====================================================
   第一次运行
   ===================================================== */

update();



/* =====================================================
   每秒更新
   ===================================================== */

setInterval(

    update,

    1000

);

</script>


</body>

</html>
